<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 324" width="1000" height="324" role="img"><title>Principles</title><defs><linearGradient id="a0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#10B981"/></linearGradient><linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6366F1"/></linearGradient><linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#6366F1"/></linearGradient><linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#F97316"/></linearGradient><clipPath id="cp"><rect width="488.0" height="150" rx="22"/></clipPath></defs><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g transform="translate(0.0 0)"><g clip-path="url(#cp)"><rect width="488.0" height="150" fill="#0E1630"/><circle cx="468.0" cy="10" r="100" fill="#14B8A6" opacity=".09"/></g><rect x=".5" y=".5" width="487.0" height="149" rx="22" fill="none" stroke="#24325C"/><rect x="24" y="26" width="58" height="58" rx="18" fill="url(#a0)"/><g transform="translate(38 40) scale(1.2500)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /> <path d="M5 12.859a10 10 0 0 1 5.17-2.69" /> <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /> <path d="M2 8.82a15 15 0 0 1 4.177-2.643" /> <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /> <path d="m2 2 20 20" /></g><text x="100" y="52" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#E8EEFF" text-anchor="start" >Offline-first</text><text x="100" y="78" font-family="'Segoe UI','Noto Sans Arabic','Noto Kufi Arabic','Geeza Pro',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#14B8A6" text-anchor="start" >تعمل بلا إنترنت</text><text x="24" y="112" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >Local storage first, then sync when the network returns.</text><text x="24" y="132" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >Field conditions are the default, not the edge case.</text></g><g transform="translate(512.0 0)"><g clip-path="url(#cp)"><rect width="488.0" height="150" fill="#0E1630"/><circle cx="468.0" cy="10" r="100" fill="#8B5CF6" opacity=".09"/></g><rect x=".5" y=".5" width="487.0" height="149" rx="22" fill="none" stroke="#24325C"/><rect x="24" y="26" width="58" height="58" rx="18" fill="url(#a1)"/><g transform="translate(38 40) scale(1.2500)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /> <path d="m9 12 2 2 4-4" /></g><text x="100" y="52" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#E8EEFF" text-anchor="start" >Private by design</text><text x="100" y="78" font-family="'Segoe UI','Noto Sans Arabic','Noto Kufi Arabic','Geeza Pro',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#8B5CF6" text-anchor="start" >الخصوصية أولاً</text><text x="24" y="112" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >Sensitive data stays on the device, encrypted wherever</text><text x="24" y="132" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >it has to sync. No trackers, no pointless accounts.</text></g><g transform="translate(0.0 174)"><g clip-path="url(#cp)"><rect width="488.0" height="150" fill="#0E1630"/><circle cx="468.0" cy="10" r="100" fill="#3B82F6" opacity=".09"/></g><rect x=".5" y=".5" width="487.0" height="149" rx="22" fill="none" stroke="#24325C"/><rect x="24" y="26" width="58" height="58" rx="18" fill="url(#a2)"/><g transform="translate(38 40) scale(1.2500)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6" /> <path d="m4 14 6-6 2-3" /> <path d="M2 5h12" /> <path d="M7 2h1" /> <path d="m22 22-5-10-5 10" /> <path d="M14 18h6" /></g><text x="100" y="52" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#E8EEFF" text-anchor="start" >Arabic-native</text><text x="100" y="78" font-family="'Segoe UI','Noto Sans Arabic','Noto Kufi Arabic','Geeza Pro',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#3B82F6" text-anchor="start" >عربي أصيل</text><text x="24" y="112" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >True RTL layouts, Arabic-aware search and matching,</text><text x="24" y="132" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >dialect support and Arabic typography from screen one.</text></g><g transform="translate(512.0 174)"><g clip-path="url(#cp)"><rect width="488.0" height="150" fill="#0E1630"/><circle cx="468.0" cy="10" r="100" fill="#F59E0B" opacity=".09"/></g><rect x=".5" y=".5" width="487.0" height="149" rx="22" fill="none" stroke="#24325C"/><rect x="24" y="26" width="58" height="58" rx="18" fill="url(#a3)"/><g transform="translate(38 40) scale(1.2500)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7 6.82 21.18a2.83 2.83 0 0 1-3.99-.01a2.83 2.83 0 0 1 0-4L17 3" /> <path d="m16 2 6 6" /> <path d="M12 16H4" /></g><text x="100" y="52" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#E8EEFF" text-anchor="start" >Tested &amp; honest</text><text x="100" y="78" font-family="'Segoe UI','Noto Sans Arabic','Noto Kufi Arabic','Geeza Pro',Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="start" >موثوق وصريح</text><text x="24" y="112" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >Self-test routes and CI builds, and READMEs that state</text><text x="24" y="132" font-family="'Inter','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#B7C6EA" text-anchor="start" >their limits and risks openly instead of hiding them.</text></g></svg>