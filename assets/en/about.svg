<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 526" width="1000" height="526" role="img"><title>About Sajed Al-Abadlah</title><defs><linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8DBBFF"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6366F1"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#10B981"/></linearGradient><linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#F97316"/></linearGradient><clipPath id="cp"><rect width="1000" height="526" rx="28"/></clipPath></defs><style>@font-face{font-family:'Sora';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0000-05FF,U+2000-206F,U+20AC,U+2122,U+2212}@font-face{font-family:'Sora';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0000-05FF,U+2000-206F,U+20AC,U+2122,U+2212}@font-face{font-family:'Sora';font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0000-05FF,U+2000-206F,U+20AC,U+2122,U+2212}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#cp)"><rect width="1000" height="526" fill="#0E1630"/><circle cx="880" cy="0" r="230" fill="#3B82F6" opacity=".13"/><rect width="1000" height="5" fill="#3B82F6"/></g><rect x=".5" y=".5" width="999" height="525" rx="28" fill="none" stroke="#24325C"/><text x="38" y="92" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="46" font-weight="800" fill="url(#tt)" text-anchor="start" >I&#x27;m Sajed.</text><text x="38" y="130" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#9BC2FF" text-anchor="start" >Software architect · Gaza, Palestine</text><text x="38" y="166" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="17" font-weight="500" fill="#D5E0FA" text-anchor="start" >I design, code and ship complete systems entirely from a mobile phone, with no</text><text x="38" y="195" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="17" font-weight="500" fill="#D5E0FA" text-anchor="start" >desktop in the loop.</text><line x1="38" y1="238" x2="962" y2="238" stroke="#1D2B55"/><text x="38" y="272" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#8FA0C2" text-anchor="start" letter-spacing="1.8">MY WORK SITS WHERE THREE THINGS MEET</text><rect x="38.0" y="302" width="48" height="48" rx="15" fill="url(#violet)"/><g transform="translate(50.0 314) scale(1.0000)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" /></g><text x="38.0" y="380" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#E8EEFF" text-anchor="start" >Arabic-first AI &amp; automation</text><text x="38.0" y="408" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >Tools that turn long videos into</text><text x="38.0" y="430" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >Shorts, schedule posts across</text><text x="38.0" y="452" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >platforms and answer comments</text><text x="38.0" y="474" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >while I sleep.</text><rect x="355.3333333333333" y="302" width="48" height="48" rx="15" fill="url(#teal)"/><g transform="translate(367.3333333333333 314) scale(1.0000)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /> <path d="M5 12.859a10 10 0 0 1 5.17-2.69" /> <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /> <path d="M2 8.82a15 15 0 0 1 4.177-2.643" /> <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /> <path d="m2 2 20 20" /></g><text x="355.3333333333333" y="380" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#E8EEFF" text-anchor="start" >Offline-first systems for the field</text><text x="355.3333333333333" y="408" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >Registries and rosters for relief and</text><text x="355.3333333333333" y="430" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >charity work, where the network is the</text><text x="355.3333333333333" y="452" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >exception and the data must stay</text><text x="355.3333333333333" y="474" font-family="'Sora','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#AFC0E6" text-anchor="start" >private.</text><rect x="672.6666666666666" y="302" width="48" height="48" rx="15" fill="url(#amber)"/><g transform="translate(684.6666666666666 314) scale(1.0000)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2" /> <path d="M12 18h.01" /></g><text x="672.6666666666666" y="380" font-family="'Sora','Segoe UI',Arial,san